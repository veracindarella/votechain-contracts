[workspace]
members = [
    "contracts/governance",
    "contracts/token",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Handsoff/contracts"

[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Mutation testing (issue #572): cargo-mutants runs nightly on the governance
# crate via .github/workflows/mutation.yml using .cargo/mutants.toml.
# Security-critical governance functions are prioritized there so surviving
# mutants in high-risk paths are surfaced as a quality signal.
