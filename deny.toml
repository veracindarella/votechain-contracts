[graph]
# Fail on duplicate crate versions so CI catches new duplicates.
duplicate = "deny"

[advisories]
# Fail on any security advisory.
vulnerability = "deny"
unmaintained = "deny"
unsound = "deny"
yanked = "deny"
notice = "warn"

[licenses]
# Keep license checks permissive; this issue only targets duplicates/advisories.
allow = []
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
