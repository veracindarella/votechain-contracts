x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  dev:
    build: .
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /app
    environment:
      - NETWORK=local
    depends_on:
      stellar-node:
        condition: service_healthy
    stdin_open: true
    tty: true
    logging: *default-logging
    healthcheck:
      # The dev container is "healthy" as soon as the Rust toolchain is available.
      test: ["CMD", "rustc", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy   # wait until redis-cli ping returns PONG
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "6379:6379"
    logging: *default-logging
    healthcheck:
      # Confirm Redis is accepting connections before dependent services start.
      # redis-cli exits 0 only when it receives "PONG" back from the server.
      # interval/timeout/retries are tuned for fast local startup:
      #   - first check at 3s, then every 5s → healthy within ~8s normally
      #   - 5 retries × 5s = 25s maximum wait before unhealthy
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  stellar-node:
    image: stellar/quickstart:latest@sha256:4f8dfd693deba57fddef7f0bc722e4782c2e606c8675e3adc5438cebae249295
    ports:
      - "8000:8000"
    environment:
      - ENABLE_SOROBAN_RPC=true
    command: --local
    logging: *default-logging
    healthcheck:
      # Wait until the Soroban RPC endpoint responds to HTTP requests.
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Observability (#66) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  cargo-cache:
