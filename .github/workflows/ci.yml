name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly mutation testing run for the governance contract.
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "22.8.2"

jobs:
  license-check:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Apache 2.0 license header on all .rs files
        run: |
          missing=()
          while IFS= read -r -d '' file; do
            if ! head -5 "$file" | grep -q "Apache License\|Apache-2.0\|Licensed under the Apache"; then
              missing+=("$file")
            fi
          done < <(find contracts -name "*.rs" -print0; git ls-files -z '*.ts' '*.tsx' '*.sh')
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing Apache 2.0 license header in:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All .rs, .ts, .tsx and .sh files have the license header."

  errors-doc-check:
    name: Error Reference Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify docs/errors.md documents every ContractError variant
        run: bash scripts/check-errors-doc.sh

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-method-coverage:
    name: Contract Method Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect contract changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -q '^contracts/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report contract method coverage
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Collect every public contract function (pub fn) declared in contracts/.
          mapfile -t PUBLIC_FNS < <(
            grep -rhoE 'pub fn [a-zA-Z0-9_]+' contracts --include='*.rs' \
              | awk '{print $3}' | sort -u
          )

          if [ ${#PUBLIC_FNS[@]} -eq 0 ]; then
            echo "No public contract functions found."
            exit 0
          fi

          # Collect every function name referenced from test code (#[test] / #[cfg(test)]).
          mapfile -t TESTED < <(
            grep -rhoE '\b[a-zA-Z0-9_]+\s*\(' contracts --include='*.rs' \
              | sed -E 's/\s*\($//' | sort -u
          )

          echo "## Contract Method Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Public function | Has test |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          UNTESTED=()
          for fn in "${PUBLIC_FNS[@]}"; do
            if printf '%s\n' "${TESTED[@]}" | grep -qx "$fn"; then
              echo "| \`$fn\` | yes |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$fn\` | no |" >> "$GITHUB_STEP_SUMMARY"
              UNTESTED+=("$fn")
            fi
          done

          echo ""
          echo "Contract method coverage report:"
          for fn in "${PUBLIC_FNS[@]}"; do
            if printf '%s\n' "${TESTED[@]}" | grep -qx "$fn"; then
              echo "  [tested]   $fn"
            else
              echo "  [UNTESTED] $fn"
            fi
          done

          if [ ${#UNTESTED[@]} -gt 0 ]; then
            echo ""
            echo "Untested public contract functions:"
            for fn in "${UNTESTED[@]}"; do
              echo "::warning title=Untested contract function::$fn has no test"
            done
          else
            echo "All public contract functions have a test."
          fi

  deny:
    name: Cargo Deny (bans & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny check
        # Fails the job on duplicate crate versions (bans) or security
        # advisories. cargo-deny prints human-readable diagnostics to stderr.
        run: cargo deny --all-features check bans advisories

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  mutation-testing:
    name: Mutation Testing (governance)
    runs-on: ubuntu-latest
    # Nightly-only quality signal; not a required PR gate.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-
            ${{ runner.os }}-cargo-
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants on governance crate
        # Uses the existing .cargo/mutants.toml configuration.
        run: |
          cargo mutants --package votechain-governance \
            --output mutants.out \
            --json mutants.out/mutants.json || true
      - name: Report surviving mutants
        run: |
          echo "## Mutation Testing — votechain-governance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutants.out/missed.txt ]; then
            SURVIVORS=$(wc -l < mutants.out/missed.txt | tr -d ' ')
            echo "Surviving mutants: **${SURVIVORS}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$SURVIVORS" -gt 0 ]; then
              echo "| Surviving mutant |" >> "$GITHUB_STEP_SUMMARY"
              echo "| --- |" >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r line; do
                echo "| \`$line\` |" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=Surviving mutant::$line"
              done < mutants.out/missed.txt
            else
              echo "No surviving mutants." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No mutation report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-governance
          path: mutants.out
          if-no-files-found: warn

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-
            ${{ runner.os }}-cargo-
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --branch \
            --lcov --output-path lcov.info
      - name: Enforce coverage thresholds
        # votechain-governance manages financial decisions, so it requires
        # 90% line and 85% branch coverage; other packages require 80% lines.
        run: |
          declare -A LINE_MIN=([votechain-governance]=90 [votechain-token]=80)
          declare -A BRANCH_MIN=([votechain-governance]=85)
          FAIL=0
          for pkg in votechain-governance votechain-token; do
            cargo llvm-cov --package "$pkg" --all-features --branch --summary-only --json \
              --output-path "${pkg}-coverage.json"
            cargo llvm-cov report --package "$pkg" --branch --summary-only | tee "${pkg}-coverage-summary.txt"
            LINE_PCT=$(jq '.data[0].totals.lines.percent' "${pkg}-coverage.json")
            BRANCH_PCT=$(jq '.data[0].totals.branches.percent // 0' "${pkg}-coverage.json")
            echo "$pkg: lines ${LINE_PCT}% (min ${LINE_MIN[$pkg]}%), branches ${BRANCH_PCT}%"
            echo "| $pkg | ${LINE_PCT}% | ${BRANCH_PCT}% |" >> coverage-table.md
            if awk -v p="$LINE_PCT" -v m="${LINE_MIN[$pkg]}" 'BEGIN{exit !(p+0<m)}'; then
              echo "::error::$pkg line coverage ${LINE_PCT}% is below ${LINE_MIN[$pkg]}% threshold"; FAIL=1
            fi
            if [ -n "${BRANCH_MIN[$pkg]:-}" ] && awk -v p="$BRANCH_PCT" -v m="${BRANCH_MIN[$pkg]}" 'BEGIN{exit !(p+0<m)}'; then
              echo "::error::$pkg branch coverage ${BRANCH_PCT}% is below ${BRANCH_MIN[$pkg]}% threshold"; FAIL=1
            fi
          done
      - 
